---
listenAddr: 0.0.0.0:3000
log:
  level: trace
discourse:
  server: https://meta.discourse.com
  secret: <replace-me>
  # Optional shared secret for the Discourse webhook receiver. When set,
  # distrust exposes /oauth2/webhook and invalidates cached login
  # sessions on user_logged_out / user_destroyed / user_suspended /
  # user_anonymized events. Configure the matching secret in Discourse
  # under Admin → API → Webhooks.
  # webhookSecret: <replace-me>
oidc:
  # The issuer URL advertised in OIDC discovery and ID tokens.
  # Must be the public base URL of the /oauth2 path of this server.
  issuer: https://distrust.example.org/oauth2

  # 32-byte global secret used by fosite to sign opaque tokens.
  # Must be EXACTLY 32 bytes long. Generate with e.g.:
  #   openssl rand -hex 16
  secret: <replace-me-with-32-byte-secret>

  # RSA private key (PEM, PKCS#1) used to sign ID tokens.
  # Generate with: ./distrust genkey > distrust.key
  # then paste the PEM block here under privateKey: |
  privateKey: |
    -----BEGIN RSA PRIVATE KEY-----
    <replace-me>
    -----END RSA PRIVATE KEY-----

  # Optional path to a SQLite database for silent-login session
  # persistence. When unset, sessions live in process memory and are
  # lost on restart — `prompt=none` then degrades to `login_required`
  # until the user re-authenticates interactively. The file is opened
  # in WAL mode; the directory must be writable by the distrust user.
  # sessionDB: /var/lib/distrust/sessions.db

# Optional list of trusted reverse-proxy CIDRs/IPs.
# Only requests originating from these addresses may set X-Forwarded-Proto.
# Leave empty (or omit) when running directly without a proxy.
# trustedProxies:
#   - 127.0.0.1/32
#   - 10.0.0.0/8

clients:
  test:
    secret: foobar
    allowGroups: ['team']
    redirectURIs:
      - 'https://openidconnect.net/callback'
